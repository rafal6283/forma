name: forma
description: "Forma — trening w domu z lokalnym trenerem, tętnem z opasek BLE i Health Connect."
publish_to: 'none'
version: 1.8.0+13

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_blue_plus: ">=2.3.0 <3.0.0"
  health: ^13.1.0
  flutter_tts: ^4.2.0
  wakelock_plus: any
  path_provider: any
  shared_preferences: any
  flutter_secure_storage: any
  http: any
  share_plus: ^13.0.0
  flutter_web_auth_2: ^5.0.0
  speech_to_text: ^7.0.0
  audioplayers: ^6.1.0
  flutter_local_notifications: 22.3.3
  timezone: ^0.11.0
  camera: ^0.11.4
  google_mlkit_pose_detection: 0.16.1
  koofr_backup_ui:
    git:
      url: https://github.com/rafal6283/nocny-licznik
      path: packages/koofr_backup_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
  assets:
    - assets/exercises.json
    - assets/muscles.json
    - assets/sounds/
